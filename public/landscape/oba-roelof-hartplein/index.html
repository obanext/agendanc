<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<link rel="icon" href="data:,">
<title>Weekagenda OBA Roelof Hartplein</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}.header{height:112px;background:#e7a024;padding:24px 40px;position:relative}.brand{font-size:50px;font-weight:900;line-height:64px}.brand-white{color:#fff}.header-right{position:absolute;right:40px;top:34px;font-size:34px;font-weight:900}.header-right span{display:inline-block;margin-left:28px}.agenda{height:calc(100% - 112px);padding:8px 48px}.agenda-page{display:none;height:100%}.row{display:table;width:100%;height:12.5%;border-bottom:2px solid #e7a024;table-layout:fixed}.row>div{display:table-cell;vertical-align:middle}.day{width:18%;font-size:32px;font-weight:900;text-transform:lowercase}.date{width:105px;height:80px;background:#000;color:#fff;text-align:center;font-weight:900;vertical-align:middle!important}.date strong,.date span{display:block}.date strong{font-size:34px;line-height:38px}.date span{font-size:15px;text-transform:uppercase}.details{padding:0 30px;overflow:hidden}.title{font-size:34px;line-height:40px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.location{margin-top:4px;color:#e7a024;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-time{width:150px;text-align:right;font-size:34px;font-weight:900}.empty{font-size:42px;font-weight:900;text-align:center;padding-top:300px}
</style>
</head>
<body>
<header class="header"><div class="brand"><span class="brand-white">week</span>agenda</div><div class="header-right"><span id="time"></span><span id="pageIndicator">0/0</span></div></header>
<main class="agenda"><section class="agenda-page" data-page="1"><div class="row">
  <div class="day">woensdag</div>
  <div class="date"><strong>08</strong><span>jul</span></div>
  <div class="details"><div class="title">Cursus: Slimmer met je smartphone (bijeenkomst 2)</div><div class="location">Kluun-zaal</div></div>
  <div class="event-time">14.30</div>
</div><div class="row">
  <div class="day">donderdag</div>
  <div class="date"><strong>09</strong><span>jul</span></div>
  <div class="details"><div class="title">Taalcafé</div><div class="location">Kluun-zaal</div></div>
  <div class="event-time">14.30</div>
</div><div class="row">
  <div class="day">woensdag</div>
  <div class="date"><strong>15</strong><span>jul</span></div>
  <div class="details"><div class="title">Cursus: Slimmer met je smartphone (bijeenkomst 3)</div><div class="location">Kluun-zaal</div></div>
  <div class="event-time">14.30</div>
</div></section></main>
<script>
(function () {
  var pages = document.getElementsByClassName("agenda-page");
  var indicator = document.getElementById("pageIndicator");
  var current = 0;

  function two(value) { return value < 10 ? "0" + value : String(value); }
  function updateTime() {
    var now = new Date();
    document.getElementById("time").innerHTML = two(now.getHours()) + ":" + two(now.getMinutes());
  }
  function showPage(index) {
    var i;
    for (i = 0; i < pages.length; i++) pages[i].style.display = "none";
    if (pages.length) pages[index].style.display = "block";
    indicator.innerHTML = "" || ((index + 1) + "/" + pages.length);
  }

  updateTime();
  window.setInterval(updateTime, 60000);
  showPage(0);

  if (pages.length > 1) {
    window.setInterval(function () {
      current = current + 1;
      if (current >= pages.length) current = 0;
      showPage(current);
    }, 8000);
  }
}());
</script>
</body>
</html>
